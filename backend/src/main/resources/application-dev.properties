## =====================================================================
## Factory Ops Backend - DEV Profile
## =====================================================================

quarkus.log.console.json=false
quarkus.log.level=DEBUG

# Seed data enabled in dev
factory.ops.seed.enabled=true

# Dev mode: disable NATS (not required for dev startup)
nats.enabled=false

# Dev mode: disable outbox poller sending (just log)
factory.ops.outbox.dry-run=true

# MongoDB DevServices enabled in dev
quarkus.mongodb.devservices.enabled=true

# Swagger UI always visible
quarkus.swagger-ui.always-include=true

# JWT keys for dev (DEV ONLY — these files are gitignored in prod)
mp.jwt.verify.publickey.location=jwt/publicKey.pem
smallrye.jwt.sign.key.location=jwt/privateKey.pem

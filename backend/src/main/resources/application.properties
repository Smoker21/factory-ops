## =====================================================================
## Factory Ops Backend - Application Properties
## =====================================================================

# HTTP
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
quarkus.http.cors.headers=Content-Type,Authorization,X-Requested-With,X-XSRF-TOKEN
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.access-control-allow-credentials=true

# MongoDB
# In test profile the connection-string is left unset so DevServices provisions
# a Testcontainer and fills it in.  Setting it explicitly (even to a fallback)
# would suppress DevServices.
%prod.quarkus.mongodb.connection-string=${MONGO_URI:mongodb://localhost:27017}
%dev.quarkus.mongodb.connection-string=${MONGO_URI:mongodb://localhost:27017}
quarkus.mongodb.database=${MONGO_DB:factory_ops}

# JWT - DEVELOPMENT KEYS ONLY. Replace with real keys in production.
mp.jwt.verify.publickey.location=jwt/publicKey.pem
mp.jwt.verify.issuer=factory-ops
mp.jwt.verify.audiences=factory-ops-access
smallrye.jwt.sign.key.location=jwt/privateKey.pem
# JWT token extraction — dual-mode (M5.3 S-009, §FR-1.6, ADR-0015):
#   mp.jwt.token.header=Cookie  → SmallRye reads access_token cookie first
#   mp.jwt.token.cookie=access_token → the cookie name to read
#   smallrye.jwt.always-check-authorization=true → fallback to Bearer header if cookie absent
# This enables: cookie-first priority with transparent fallback to Authorization: Bearer header.
# Existing Bearer-only clients (integration tests, legacy API consumers) continue to work.
mp.jwt.token.header=Cookie
mp.jwt.token.cookie=access_token
smallrye.jwt.always-check-authorization=true

# Access token validity: 15 minutes
factory.ops.jwt.access.expiry.seconds=900
# Refresh token validity: 7 days
factory.ops.jwt.refresh.expiry.seconds=604800

# MinIO / Object Storage
minio.endpoint=${MINIO_URL:http://localhost:9000}
minio.access-key=${MINIO_AK:minioadmin}
minio.secret-key=${MINIO_SK:minioadmin}
minio.bucket=${MINIO_BUCKET:factory-ops-attachments}

# NATS
nats.url=${NATS_URL:nats://localhost:4222}
nats.stream=factory-ops
nats.enabled=${NATS_ENABLED:false}

# HR Integration (ADR-0007 / ADR-0014)
# Modes: mock | h2 | external
#   mock     - hard-coded MockHrClient (5 fixed employees)
#   h2       - H2 in-memory DB seeded from test_data/hr_employees.csv
#   external - real corporate HR REST API (not yet implemented)
hr.mode=${HR_MODE:mock}
hr.mock.url=http://localhost:8080/mock-hr

# H2 datasource for hr.mode=h2.  Always declared but only used when active.
# Schema + seed data loaded by H2HrInitializer at startup.
quarkus.datasource.hr.db-kind=h2
quarkus.datasource.hr.jdbc.url=jdbc:h2:mem:hrdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
quarkus.datasource.hr.jdbc.driver=org.h2.Driver
quarkus.datasource.hr.username=sa
quarkus.datasource.hr.password=
hr.h2.csv.path=${HR_H2_CSV_PATH:test_data/hr_employees.csv}
hr.h2.csv.classpath-fallback=test_data/hr_employees.csv

# Seed data (dev only)
factory.ops.seed.enabled=false

# OpenAPI / Swagger
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.path=/openapi
quarkus.smallrye-openapi.info-title=Factory Ops API
quarkus.smallrye-openapi.info-version=1.5.0
quarkus.smallrye-openapi.info-description=Factory shift management system API

# Logging
quarkus.log.console.json=false
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{3.}] (%t) %s%e%n
quarkus.log.level=INFO
quarkus.log.category."com.factoryops".level=DEBUG

# Health
quarkus.smallrye-health.ui.always-include=true

# MongoDB DevServices (disabled when MONGO_URI is set)
quarkus.mongodb.devservices.enabled=true

# Outbox poller interval
factory.ops.outbox.poll.enabled=true
factory.ops.outbox.poll.interval=5s
factory.ops.outbox.poll.batch-size=100

# Security: all /v1/* endpoints require authentication by default
# Public endpoints are explicitly listed
quarkus.http.auth.permission.authenticated.paths=/v1/*
quarkus.http.auth.permission.authenticated.policy=authenticated

quarkus.http.auth.permission.public.paths=/v1/auth/login,/v1/auth/refresh,/v1/health,/mock-hr/*,/q/*,/openapi
quarkus.http.auth.permission.public.policy=permit

# ─── S-016: Account lockout ──────────────────────────────────────────────────
# Number of consecutive failed logins before account is locked
auth.lockout.threshold=${AUTH_LOCKOUT_THRESHOLD:5}
# Duration in minutes an account remains locked after reaching the threshold
auth.lockout.duration-minutes=${AUTH_LOCKOUT_DURATION_MINUTES:15}

# ─── S-015: Auth endpoint rate limiting ──────────────────────────────────────
# Sliding window duration in seconds for all rate-limit counters
auth.rate-limit.window-seconds=${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
# Login: max requests per IP per window
auth.rate-limit.login.per-ip=${AUTH_RATE_LIMIT_LOGIN_PER_IP:100}
# Login: max requests per account (accountName) per window
auth.rate-limit.login.per-account=${AUTH_RATE_LIMIT_LOGIN_PER_ACCOUNT:10}
# Logout / changePassword: max requests per IP per window
auth.rate-limit.other.per-ip=${AUTH_RATE_LIMIT_OTHER_PER_IP:30}
# Logout / changePassword: max requests per account per window
auth.rate-limit.other.per-account=${AUTH_RATE_LIMIT_OTHER_PER_ACCOUNT:5}

# ─── S-009: JWT cookie / CSRF (M5.3) ────────────────────────────────────────
# Access token TTL for issuance (referenced by application code via factory.ops.jwt.access.expiry.seconds)
# Note: factory.ops.jwt.access.expiry.seconds=900 already set above; kept consistent.
smallrye.jwt.new-token.lifespan=900
# Refresh token cookie Max-Age: 7 days
auth.refresh.token.lifespan-seconds=${AUTH_REFRESH_TOKEN_LIFESPAN_SECONDS:604800}
# Cookie SameSite attribute (prod=Strict; dev profile overrides to Lax for localhost cross-port)
auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Strict}
# Cookie Secure flag (prod=true; dev profile overrides to false for localhost http)
auth.cookie.secure=${AUTH_COOKIE_SECURE:true}
# CSRF filter exempt paths (comma-separated, prefix-matched)
# /mock-hr is excluded from the default (prod) list because MockHrResource is @IfBuildProfile("dev") only
security.csrf.exempt-paths=${CSRF_EXEMPT_PATHS:/q/health,/q/health/live,/q/health/ready,/v1/auth/login,/q/openapi,/q/swagger-ui,/openapi}

# Dev profile overrides: SameSite=Lax so browser sends cookies on localhost cross-port (:5173 -> :8080)
# /mock-hr added back only in dev (MockHrResource only exists in dev)
%dev.auth.cookie.same-site=Lax
%dev.auth.cookie.secure=false
%dev.security.csrf.exempt-paths=/q/health,/q/health/live,/q/health/ready,/v1/auth/login,/q/openapi,/q/swagger-ui,/openapi,/mock-hr

# Test profile overrides: disable Secure flag so integration tests over HTTP work correctly
%test.auth.cookie.secure=false
%test.auth.cookie.same-site=Lax

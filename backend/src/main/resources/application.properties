## =====================================================================
## Factory Ops Backend - Application Properties
## =====================================================================

# HTTP
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
quarkus.http.cors.headers=Content-Type,Authorization,X-Requested-With
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS

# MongoDB
# In test profile the connection-string is left unset so DevServices provisions
# a Testcontainer and fills it in.  Setting it explicitly (even to a fallback)
# would suppress DevServices.
%prod.quarkus.mongodb.connection-string=${MONGO_URI:mongodb://localhost:27017}
%dev.quarkus.mongodb.connection-string=${MONGO_URI:mongodb://localhost:27017}
quarkus.mongodb.database=${MONGO_DB:factory_ops}

# JWT - DEVELOPMENT KEYS ONLY. Replace with real keys in production.
mp.jwt.verify.publickey.location=jwt/publicKey.pem
mp.jwt.verify.issuer=factory-ops
mp.jwt.verify.audiences=factory-ops-access
smallrye.jwt.sign.key.location=jwt/privateKey.pem
mp.jwt.token.header=Authorization
mp.jwt.token.scheme=Bearer

# Access token validity: 15 minutes
factory.ops.jwt.access.expiry.seconds=900
# Refresh token validity: 7 days
factory.ops.jwt.refresh.expiry.seconds=604800

# MinIO / Object Storage
minio.endpoint=${MINIO_URL:http://localhost:9000}
minio.access-key=${MINIO_AK:minioadmin}
minio.secret-key=${MINIO_SK:minioadmin}
minio.bucket=${MINIO_BUCKET:factory-ops-attachments}

# NATS
nats.url=${NATS_URL:nats://localhost:4222}
nats.stream=factory-ops
nats.enabled=${NATS_ENABLED:false}

# HR Integration (ADR-0007 / ADR-0014)
# Modes: mock | h2 | external
#   mock     - hard-coded MockHrClient (5 fixed employees)
#   h2       - H2 in-memory DB seeded from test_data/hr_employees.csv
#   external - real corporate HR REST API (not yet implemented)
hr.mode=${HR_MODE:mock}
hr.mock.url=http://localhost:8080/mock-hr

# H2 datasource for hr.mode=h2.  Always declared but only used when active.
# Schema + seed data loaded by H2HrInitializer at startup.
quarkus.datasource.hr.db-kind=h2
quarkus.datasource.hr.jdbc.url=jdbc:h2:mem:hrdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
quarkus.datasource.hr.jdbc.driver=org.h2.Driver
quarkus.datasource.hr.username=sa
quarkus.datasource.hr.password=
hr.h2.csv.path=${HR_H2_CSV_PATH:test_data/hr_employees.csv}
hr.h2.csv.classpath-fallback=test_data/hr_employees.csv

# Seed data (dev only)
factory.ops.seed.enabled=false

# OpenAPI / Swagger
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.path=/openapi
quarkus.smallrye-openapi.info-title=Factory Ops API
quarkus.smallrye-openapi.info-version=1.3.0
quarkus.smallrye-openapi.info-description=Factory shift management system API

# Logging
quarkus.log.console.json=false
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{3.}] (%t) %s%e%n
quarkus.log.level=INFO
quarkus.log.category."com.factoryops".level=DEBUG

# Health
quarkus.smallrye-health.ui.always-include=true

# MongoDB DevServices (disabled when MONGO_URI is set)
quarkus.mongodb.devservices.enabled=true

# Outbox poller interval
factory.ops.outbox.poll.enabled=true
factory.ops.outbox.poll.interval=5s
factory.ops.outbox.poll.batch-size=100

# Security: all /v1/* endpoints require authentication by default
# Public endpoints are explicitly listed
quarkus.http.auth.permission.authenticated.paths=/v1/*
quarkus.http.auth.permission.authenticated.policy=authenticated

quarkus.http.auth.permission.public.paths=/v1/auth/login,/v1/auth/refresh,/v1/health,/mock-hr/*,/q/*,/openapi
quarkus.http.auth.permission.public.policy=permit

## Test profile properties
# In CI (Docker available): DevServices spins up a MongoDB replica set via Testcontainers.
# Unit tests (com.factoryops.unit.*) use mockito and run without Docker.
# @QuarkusTest integration tests require MongoDB DevServices.
quarkus.mongodb.devservices.enabled=true
quarkus.mongodb.devservices.replica-set-name=rs0
factory.ops.seed.enabled=true
nats.enabled=false
factory.ops.outbox.poll.enabled=false
factory.ops.outbox.dry-run=true
quarkus.log.level=WARN
quarkus.log.category."com.factoryops".level=INFO

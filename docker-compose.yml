# ======================================================
# Factory Ops — Docker Compose (共用基底)
# 用於本機開發與 CI。正式環境使用 docker-compose.prod.yml 覆寫。
#
# 快速開始:
#   cp .env.example .env  # 修改 JWT_SECRET 等必填值
#   docker compose up
# ======================================================

services:

  # ── MongoDB 7 (replica set，支援 transaction) ─────────────────────────────
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - mongodata:/data/db
    environment:
      MONGO_INITDB_DATABASE: factory_ops
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Replica set 初始化(一次性 job)
  mongo-rs-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: >
      mongosh --host mongo:27017 --quiet /docker-entrypoint-initdb.d/mongo-rs-init.js
    volumes:
      - ./docker/mongo-rs-init.js:/docker-entrypoint-initdb.d/mongo-rs-init.js:ro
    restart: "no"

  # MongoDB 索引初始化(一次性 job，在 rs 初始化後執行)
  mongo-idx-init:
    image: mongo:7
    depends_on:
      mongo-rs-init:
        condition: service_completed_successfully
    entrypoint: >
      mongosh "mongodb://mongo:27017/factory_ops?replicaSet=rs0" --quiet
      /docker-entrypoint-initdb.d/init-indexes.js
    volumes:
      - ./backend/src/main/resources/db/init-indexes.js:/docker-entrypoint-initdb.d/init-indexes.js:ro
    restart: "no"

  # ── NATS 2.10 (JetStream) ────────────────────────────────────────────────
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data"]
    ports:
      - "${NATS_HOST_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── MinIO (S3 相容物件儲存) ───────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # MinIO bucket 初始化(一次性 job)
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-factory-ops-attachments}
    entrypoint: /bin/sh /init/minio-init.sh
    volumes:
      - ./docker/minio-init.sh:/init/minio-init.sh:ro
    restart: "no"

  # ── Backend (Kotlin / Quarkus) ───────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    environment:
      QUARKUS_PROFILE: prod
      MONGO_URI: mongodb://mongo:27017/factory_ops?replicaSet=rs0
      MONGO_DB: factory_ops
      NATS_URL: nats://nats:4222
      NATS_ENABLED: "true"
      MINIO_URL: http://minio:9000
      MINIO_AK: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SK: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-factory-ops-attachments}
      HR_MODE: ${HR_MODE:-mock}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-}
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH:-}
      # S-016: Account lockout
      AUTH_LOCKOUT_THRESHOLD: ${AUTH_LOCKOUT_THRESHOLD:-5}
      AUTH_LOCKOUT_DURATION_MINUTES: ${AUTH_LOCKOUT_DURATION_MINUTES:-15}
      # S-015: Rate limiting
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-60}
      AUTH_RATE_LIMIT_LOGIN_PER_IP: ${AUTH_RATE_LIMIT_LOGIN_PER_IP:-100}
      AUTH_RATE_LIMIT_LOGIN_PER_ACCOUNT: ${AUTH_RATE_LIMIT_LOGIN_PER_ACCOUNT:-10}
      AUTH_RATE_LIMIT_OTHER_PER_IP: ${AUTH_RATE_LIMIT_OTHER_PER_IP:-30}
      AUTH_RATE_LIMIT_OTHER_PER_ACCOUNT: ${AUTH_RATE_LIMIT_OTHER_PER_ACCOUNT:-5}
    depends_on:
      mongo-rs-init:
        condition: service_completed_successfully
      mongo-idx-init:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/q/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ── Frontend (React / nginx) ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_USE_MSW: "false"
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongodata:
  natsdata:
  miniodata:

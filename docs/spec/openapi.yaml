            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/ActionRequestStatus' }
                reason: { type: string }
      responses:
        '200':
          description: 已變更
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionRequest' }

  # /action-requests/{actionRequestId}/relay
  # ★ v1.3 已移除(Q-14 拍板:targetOrgId 必為 leaf,改為 single-hop direct dispatch;見 ADR-0008 v1.3)

  /action-requests/{actionRequestId}/convert-to-task:
    parameters:
      - in: path
        name: actionRequestId
        required: true
        schema: { type: string }
    post:
      tags: [ActionRequests]
      summary: 將 ActionRequest 轉換為 Task
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConvertActionRequestToTaskRequest' }
      responses:
        '201':
          description: 已轉換,回傳新 Task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '409':
          $ref: '#/components/responses/Conflict'

  # ===================== Attachments =====================
  /attachments:
    post:
      tags: [Attachments]
      summary: 建立附件 metadata 並取得上傳用 presigned URL
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAttachmentRequest' }
      responses:
        '201':
          description: 已建立 metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttachmentUploadTicket' }

  /attachments/{attachmentId}:
    parameters:
      - in: path
        name: attachmentId
        required: true
        schema: { type: string }
    get:
      tags: [Attachments]
      summary: 取得附件 metadata + 下載 URL
      responses:
        '200':
          description: Attachment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
    delete:
      tags: [Attachments]
      summary: 軟刪除附件
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204': { description: No Content }

  /attachments/{attachmentId}/finalize:
    parameters:
      - in: path
        name: attachmentId
        required: true
        schema: { type: string }
    post:
      tags: [Attachments]
      summary: 上傳完成後通知系統(觸發 checksum / 病毒掃描)
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: 已 finalize
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }

  # ===================== Webhooks =====================
  /webhooks:
    get:
      tags: [Webhooks]
      summary: 列出已註冊 webhook(預留)
      responses:
        '200':
          description: Webhook 清單
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Webhook' }
    post:
      tags: [Webhooks]
      summary: 註冊 webhook(預留)
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWebhookRequest' }
      responses:
        '201':
          description: 已註冊
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Webhook' }

  /webhooks/{webhookId}:
    parameters:
      - in: path
        name: webhookId
        required: true
        schema: { type: string }
    delete:
      tags: [Webhooks]
      summary: 移除 webhook
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204': { description: No Content }

# =========================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        過渡期 Bearer header 模式(M5.5 frontend 切換 cookie 後 M6 移除)。
        Resolver 順序:cookie `access_token` 優先,本欄位 fallback。詳見 ADR-0015。
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: |
        v1.5 新增 — JWT access token 以 httpOnly + Secure + SameSite=Strict cookie 攜帶(Path=`/v1`,15 分壽命)。
        瀏覽器自動帶上,client 端不需手動處理。詳見 §FR-1.6 與 ADR-0015。
        **注意**:cookieAuth 通過 ≠ 可放行 mutating request;mutating 額外要求 `X-XSRF-TOKEN` header 與 `XSRF-TOKEN` cookie 比對(double-submit),見 `parameters.CsrfHeader`。

  parameters:
    CsrfHeader:
      in: header
      name: X-XSRF-TOKEN
      required: true
      schema:
        type: string
        minLength: 32
      description: |
        **CSRF double-submit token**(v1.5 新增,§FR-1.7 / ADR-0015)。
        所有 mutating 端點(`POST` / `PATCH` / `PUT` / `DELETE`,除 `/v1/auth/login` 與 `/v1/health`)必須帶。
        值由 client 從 `XSRF-TOKEN` cookie 讀取後填入(該 cookie 為 non-httpOnly,JS 可讀)。
        Server 逐字比對 cookie 與 header,不相等(含任一缺漏)→ 403 + `application/problem+json`,`title=CSRF_TOKEN_MISMATCH`。
        Cookie 在 login / refresh 成功響應由 server 設置(15 分壽命,每次重發 rotate)。
    OrgIdParam:
      in: path
      name: orgId
      required: true
      schema: { type: string }
      description: |
        Organization ID。在 `/orgs/{orgId}/...` 子路徑中,根據端點語意可能是 root org 或 任一節點:
        - `/orgs/{orgId}/groups`、`/orgs/{orgId}/project-templates` 等管理面 API:`orgId` 為 **rootOrgId**
        - `/orgs/{orgId}/dispatch-action-request`、`/orgs/{orgId}/transfer-leader`:`orgId` 為**特定節點**(可能任一層)
    GroupIdParam:
      in: path
      name: groupId
      required: true
      schema: { type: string }
    TemplateIdParam:
      in: path
      name: templateId
      required: true
      schema: { type: string }
    ProjectIdParam:
      in: path
      name: projectId
      required: true
      schema: { type: string }
    TaskIdParam:
      in: path
      name: taskId
      required: true
      schema: { type: string }
    UserIdParam:
      in: path
      name: userId
      required: true
      schema: { type: string }
    CursorParam:
      in: query
      name: cursor
      schema: { type: string }
      description: cursor-based pagination 游標
    LimitParam:
      in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    FieldsParam:
      in: query
      name: fields
      schema: { type: string }
      description: 逗號分隔的欄位投影,例 `id,title,status,ownerId`
    SinceParam:
      in: query
      name: since
      schema: { type: string, format: date-time }
      description: 增量同步起始時間(以 updatedAt 比對)

  responses:
    Unauthorized:
      description: 未認證
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: 無權限
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: 找不到資源
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: 業務規則衝突(狀態流、唯一性)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationError:
      description: 輸入驗證失敗
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ValidationProblem' }
    CsrfMismatch:
      description: |
        CSRF 雙提交校驗失敗(v1.5,§FR-1.7 / ADR-0015)。
        `X-XSRF-TOKEN` header 與 `XSRF-TOKEN` cookie 缺漏或不相等時返回。
        Body `title=CSRF_TOKEN_MISMATCH`;`detail` 描述哪一邊缺漏(不洩漏 nonce 內容)。
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    # ---------- 共通 ----------
    Problem:
      description: RFC 7807 problem details
      type: object
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        traceId: { type: string }
        retryAfterSeconds:
          type: integer
          description: |
            Seconds until the next allowed retry.
            Present on 401 ACCOUNT_LOCKED and 429 RATE_LIMIT_EXCEEDED responses.
          nullable: true
      required: [title, status]

    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            errors:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  code: { type: string }
                  message: { type: string }

    PageInfo:
      type: object
      properties:
        nextCursor: { type: string, nullable: true }
        hasMore: { type: boolean }

    HistoryEntry:
      type: object
      properties:
        actorId: { type: string }
        action: { type: string, example: TASK_STATUS_CHANGED }
        at: { type: string, format: date-time }
        payload:
          type: object
          additionalProperties: true

    AttachmentRef:
      type: object
      required: [attachmentId]
      properties:
        attachmentId: { type: string }
        alt: { type: string }
        role:
          type: string
          enum: [INLINE, ATTACHMENT, COVER]
          default: ATTACHMENT

    TimeRange:
      type: object
      properties:
        start: { type: string, format: date-time, nullable: true }
        due: { type: string, format: date-time, nullable: true }

    # ---------- Auth ----------
    LoginRequest:
      type: object
      required: [accountName, password]
      properties:
        accountName: { type: string, maxLength: 30, description: HR 識別字 }
        password: { type: string, format: password }

    TokenPair:
      type: object
      required: [accessToken, refreshToken, expiresIn, tokenType]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, description: access token 秒數 }
        tokenType: { type: string, example: Bearer }

    # ---------- Enums ----------
    Role:
      type: string
      enum: [OPERATOR, SHIFT_LEAD, ENGINEER, QA, GROUP_ADMIN, GROUP_MANAGER, ORG_MANAGER, ORG_ADMIN, ADMIN]
      description: |
        - `OPERATOR` / `SHIFT_LEAD` / `ENGINEER` / `QA`:第一線執行
        - `GROUP_ADMIN`:Group 內 Template 與成員角色設定;Group settings(含 QA 雙簽)維護
        - `GROUP_MANAGER`:Group 經理,可指派 GROUP_ADMIN 代理;Group settings 最終設定權;權限 ⊇ GROUP_ADMIN
        - `ORG_MANAGER`:某 Organization 節點的唯一經理(衍生自 `Organization.managerId == userId`);可直接派 ActionRequest 到其子孫中的 leaf Org
        - `ORG_ADMIN`:該 root org 的最高權限;管理 Org 樹 / users / managers / leaders
        - `ADMIN`:系統管理員(SaaS 維運),唯一可維護 GLOBAL Templates
        > v1.3 注意:`ORG_MANAGER` 為衍生角色,不應由前端直接寫入 `User.roles[]`;由 server 從 `Organization.managerId` 反查並維護 `User.orgManagerScopes[]` 衍生欄位。

    OrganizationType:
      type: string
      description: Organization 多型 discriminator;內建型態,leaf 由 root settings.leafTypes 決定
      enum: [FAB, DIVISION, DEPARTMENT, SECTION]

    GroupType:
      type: string
      description: Group 多型 discriminator;Group 為平面結構,屬唯一 leaf Organization
      enum: [DEFAULT, LINE, TEAM, SHIFT]

    TemplateScope:
      type: string
      enum: [GLOBAL, ORG]
      description: GLOBAL 由 ADMIN 維護,所有 Org 可見;ORG 屬某 root org

    GroupMembershipRole:
      type: string
      enum: [MEMBER, LEAD, OBSERVER]

    MembershipRole:
      type: string
      enum: [MEMBER, LEAD, OBSERVER]

    ProjectStatus:
      type: string
      enum: [DRAFT, ACTIVE, PAUSED, COMPLETED, CANCELLED]

    TaskStatus:
      type: string
      enum: [OPEN, IN_PROGRESS, BLOCKED, IN_REVIEW, DONE, CANCELLED]

    Priority:
      type: string
      enum: [LOW, NORMAL, HIGH, URGENT]

    ActionRequestStatus:
      type: string
      enum: [SUBMITTED, TRIAGED, IN_PROGRESS, RESOLVED, REJECTED]

    SeverityLevel:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]

    # ---------- Organization ----------
    Organization:
      type: object
      properties:
        id: { type: string }
        rootOrgId: { type: string, description: 該節點所屬樹的 root;root 自己時等於 id }
        parentId: { type: string, nullable: true, description: null 僅 root }
        type:
          oneOf:
            - $ref: '#/components/schemas/OrganizationType'
            - type: string
              description: 自訂 type code(由 root settings 擴展)
        name: { type: string, description: 允許 Unicode 多語系混合輸入 }
        code: { type: string, description: 同 rootOrgId 內 unique }
        managerId:
          type: string
          nullable: true
          description: |
            該節點唯一經理(對應 ORG_MANAGER 角色;v1.3 新欄位)。
            為跨層 ActionRequest dispatch 授權的權威來源;`User.orgManagerScopes[]` 由此反查衍生。
        leaderIds:
          type: array
          description: |
            該節點業務負責人列表(0..N;v1.3 新欄位,取代 v1.2 leaderId 單值)。
            ActionRequest dispatch 預設 ownerId 從此集合中選(0 → 409,1 → 自動,N → 派工方指定)。
          items: { type: string }
        isLeaf: { type: boolean, description: 衍生欄位:type ∈ root.settings.leafTypes }
        depth: { type: integer, description: 衍生欄位:從 root 的距離(0 = root) }
        path: { type: string, description: 衍生欄位:`/<rootId>/.../<self>`(materialized,可選) }
        timezone: { type: string, example: Asia/Taipei, description: 僅 root 有效 }
        locale: { type: string, example: zh-TW, description: 僅 root 有效 }
        settings:
          allOf:
            - $ref: '#/components/schemas/OrgSettings'
          nullable: true
          description: 僅 root 有效
        createdAt: { type: string, format: date-time, description: ISO 8601 + offset }
        updatedAt: { type: string, format: date-time, description: ISO 8601 + offset }
        deletedAt: { type: string, format: date-time, nullable: true }
        schemaVersion: { type: integer }
      required: [id, rootOrgId, type, name, code]

    OrgSettings:
      type: object
      properties:
        orgMaxDepth:
          type: integer
          minimum: 1
          maximum: 10
          default: 5
          description: Organization 樹最大深度
        leafTypes:
          type: array
          items: { type: string }
          default: [SECTION]
          description: 哪些 type code 視為 leaf(可承載 Group / Project / Task)
        attachmentMaxBytes:
          type: integer
          format: int64
          example: 52428800
        extras:
          type: object
          additionalProperties: true

    CreateOrganizationRequest:
      type: object
      required: [type, name, code]
      properties:
        parentId:
          type: string
          nullable: true
          description: null 表示建立 root(僅 ADMIN);其他需 ORG_ADMIN(同 root)
        type: { type: string, description: FAB / DIVISION / DEPARTMENT / SECTION / 自訂 }
        name: { type: string, minLength: 1, maxLength: 120, description: 允許 Unicode 多語系混合 }
        code: { type: string, minLength: 1, maxLength: 64, pattern: '^[a-z0-9-]+$' }
        managerId:
          type: string
          nullable: true
          description: 建立時可選指定 manager(v1.3)
        leaderIds:
          type: array
          description: 建立時可選指定 leaders(0..N;v1.3)
          items: { type: string }
        timezone: { type: string, default: Asia/Taipei, description: 僅建 root 時有效 }
        locale: { type: string, default: zh-TW, description: 僅建 root 時有效 }
        settings:
          allOf:
            - $ref: '#/components/schemas/OrgSettings'
          nullable: true
          description: 僅建 root 時有效
        initialOrgAdmin:
          type: object
          description: 僅建 root 時提供;同步建立第一個 ORG_ADMIN 帳號
          required: [accountName]
          properties:
            accountName:
              type: string
              maxLength: 30
              description: 從 HR 服務拉取 profile

    UpdateOrganizationRequest:
      type: object
      description: |
        本端點不支援變更 `managerId` / `leaderIds[]`。
        - `managerId` 變更請使用 `POST /orgs/{orgId}/transfer-manager`
        - `leaderIds[]` 變更請使用 `POST /orgs/{orgId}/leaders` 與 `DELETE /orgs/{orgId}/leaders/{userId}`
      properties:
        name: { type: string }
        parentId: { type: string, nullable: true, description: 變更會做 cycle / 深度檢查 }
        type: { type: string }
        timezone: { type: string, description: 僅 root 有效 }
        locale: { type: string, description: 僅 root 有效 }
        settings:
          allOf:
            - $ref: '#/components/schemas/OrgSettings'
          description: 僅 root 有效

    OrganizationPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Organization' }
        pageInfo: { $ref: '#/components/schemas/PageInfo' }

    # ---------- Group(平面)----------
    Group:
      type: object
      properties:
        id: { type: string }
        rootOrgId: { type: string }
        organizationId: { type: string, description: 必為 leaf Organization }
        type:
          oneOf:
            - $ref: '#/components/schemas/GroupType'
            - type: string
              description: 自訂 type code
        name: { type: string, description: 允許 Unicode 多語系 }
        code: { type: string, description: 同 rootOrgId 內 unique }
        attributes:
          type: object
          additionalProperties: true
          description: type-specific 屬性(寬鬆 schema)
        leaderId: { type: string, nullable: true, description: Group 內組長(與 Organization.leaderIds 為不同概念) }
        settings:
          $ref: '#/components/schemas/GroupSettings'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: string, format: date-time, nullable: true }
        schemaVersion: { type: integer }
      required: [id, rootOrgId, organizationId, type, name, code, settings]

    GroupSettings:
      type: object
      description: Group-level 工作流客製設定(v1.3 新增,對應 ADR-0011)
      required: [qa]
      properties:
        qa:
          $ref: '#/components/schemas/QaSettings'
        extras:
          type: object
          additionalProperties: true
          description: 預留其他 Group-level 設定

    QaSettings:
      type: object
      description: |
        QA 雙簽設定。Task 建立時 snapshot 至 `task.qaReviewPolicy`,之後變更不影響該 Task。
        **Q-23 v1.4 OR 白名單語意**(取代 v1.3 AND 語意,見 ADR-0011 v1.4 Amendment):
        - `requiredReviewerRoles` 是「白名單」(誰有資格簽),**不要求每個列示角色都到齊**。
        - `dualSignRequired = true` 仍要求 `qaReviews.size >= 2` 才能 auto-complete,但角色組合任意(可同 role 兩筆,可不同 role 各一筆)。
        - **同一 user 可以以不同角色多次簽核並各記一筆**(Q5 B 拍板,輕量派工確認非品保雙簽);僅 `(reviewerId, role)` unique 限制。
      properties:
        dualSignRequired:
          type: boolean
          default: false
        requiredReviewerRoles:
          type: array
          description: |
            **白名單**:誰有資格擔任 reviewer 的角色清單(Q-23 v1.4 OR 語意)。若 dualSignRequired=true 不可為空。
            僅允許第一線角色:OPERATOR / SHIFT_LEAD / ENGINEER / QA / GROUP_ADMIN / GROUP_MANAGER
          items: { $ref: '#/components/schemas/Role' }
          default: []

    UpdateGroupSettingsRequest:
      type: object
      description: PATCH Group settings;省略的子物件保持原值
      properties:
        qa:
          $ref: '#/components/schemas/QaSettings'
        extras:
          type: object
          additionalProperties: true

    CreateGroupRequest:
      type: object
      required: [organizationId, type, name, code]
      description: |
        建立 Group。`settings` 預設為 `{ qa: { dualSignRequired: false, requiredReviewerRoles: [] }, extras: {} }`,
        若需啟用 QA 雙簽請於建立後呼叫 `PATCH /orgs/{orgId}/groups/{groupId}/settings`。
      properties:
        organizationId: { type: string, description: 必為 leaf Organization }
        type: { type: string }
        name: { type: string, minLength: 1, maxLength: 120, description: 允許 Unicode 多語系 }
        code: { type: string, minLength: 1, maxLength: 64 }
        attributes:
          type: object
          additionalProperties: true
        leaderId: { type: string, nullable: true, description: Group 內組長 }
        settings:
          allOf:
            - $ref: '#/components/schemas/GroupSettings'
          nullable: true
          description: 建立時可指定 settings;省略則用預設值

    UpdateGroupRequest:
      type: object
      properties:
        type: { type: string }
        name: { type: string }
        attributes:
          type: object
          additionalProperties: true

    GroupPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Group' }
        pageInfo: { $ref: '#/components/schemas/PageInfo' }

    GroupMembership:
      type: object
      properties:
        id: { type: string }
        rootOrgId: { type: string }
        groupId: { type: string }
        userId: { type: string }
        role: { $ref: '#/components/schemas/GroupMembershipRole' }
        joinedAt: { type: string, format: date-time }
        leftAt: { type: string, format: date-time, nullable: true }
        createdBy: { type: string }
      required: [id, rootOrgId, groupId, userId, role, joinedAt]

    # ---------- User(HR 投影)----------
    User:
      type: object
      description: HR User 的本地投影;profile 欄位以 HR 為權威,roles / orgManagerScopes / GroupMembership 由本系統管理
      properties:
        id: { type: string }
        rootOrgId: { type: string }
        accountName:
          type: string
          maxLength: 30
          description: HR 識別字;`(rootOrgId, accountName)` unique
        employeeNo: { type: string, description: snapshot from HR }
        email: { type: string, format: email, description: snapshot from HR }
        displayName: { type: string, description: snapshot from HR }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
        groupIds:
          type: array
          description: 衍生欄位:該 user 目前 active 屬於的 Group ID 集合
          items: { type: string }
        orgManagerScopes:
          type: array
          description: |
            **衍生 / cache 欄位(v1.3)**:該 user 是哪些 Organization 節點的 `managerId`。
            權威來源是 `Organization.managerId == userId` 反查;前端不可直接寫入(write-protected)。
            授權判定可即時從 Organization 反查作為防呆,本欄位為 RBAC 加速 cache。
          items: { type: string }
        primaryOrgPath:
          type: array
          description: 衍生欄位:該 user 所屬 leaf Org 從 root 的路徑
          items: { type: string }
        hrSyncedAt: { type: string, format: date-time, description: 最近一次 HR 同步時間 }
        active: { type: boolean, description: HR 標離職時 false }
        createdAt: { type: string, format: date-time }
      required: [id, rootOrgId, accountName, displayName, roles, active]

    CreateUserRequest:
      type: object
      required: [accountName]
      description: |
        以 accountName 從 HR 拉取 profile 建立本地投影。
        S-011: 暫時密碼由伺服器端以 SecureRandom 自動產生(16 字元,排除易混淆字元);
        呼叫者不需要也不應傳入密碼。回應中包含 temporaryPassword 供一次性顯示給操作員。
      properties:
        accountName: { type: string, maxLength: 30 }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }

    UpdateUserRequest:
      type: object
      description: 只能更新本系統獨有欄位;profile 欄位請以 HR 同步取得
      properties:
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
        active: { type: boolean }

    UserPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/User' }
        pageInfo: { $ref: '#/components/schemas/PageInfo' }

    # ---------- Project ----------
    Project:
      type: object
      properties:
        id: { type: string }
        rootOrgId: { type: string }
        organizationId: { type: string, description: 必為 leaf Organization }
        name: { type: string }
        descriptionMarkdown: { type: string }
        status: { $ref: '#/components/schemas/ProjectStatus' }
        ownerId: { type: string }
        memberIds:
          type: array
          items: { type: string }
        groupIds:
          type: array
          description: Project 所屬 Group(至少 1;MVP 必須屬同一 leaf Org)
          minItems: 1
          items: { type: string }
        schedule: { $ref: '#/components/schemas/TimeRange' }
        tags:
          type: array
          items: { type: string }
        templateRef:
          allOf:
            - $ref: '#/components/schemas/TemplateRef'
          nullable: true
          description: 若由 ProjectTemplate 實例化則記錄 snapshot
        overdue: { type: boolean, description: 衍生欄位:是否逾期(server 計算) }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: string, format: date-time, nullable: true }
        schemaVersion: { type: integer }
      required: [id, rootOrgId, organizationId, name, status, ownerId, memberIds, groupIds]

    CreateProjectRequest:
      type: object
      required: [organizationId, name, ownerId, groupIds]
      properties:
        organizationId: { type: string, description: 必為 leaf Organization }
        name: { type: string, minLength: 1, maxLength: 120 }
        descriptionMarkdown: { type: string }
        ownerId: { type: string }
        memberIds:
          type: array
          items: { type: string }
        groupIds:
          type: array
          minItems: 1
          items: { type: string }
        schedule: { $ref: '#/components/schemas/TimeRange' }
        tags:
          type: array
          items: { type: string }
        fromTemplateId:
          type: string
          description: 若指定,從 ProjectTemplate clone(含內含 TaskTemplate 實例化)
        fromTemplateScope:
          $ref: '#/components/schemas/TemplateScope'
        fromTemplateVersion:
          type: integer
          description: 指定 Template version(預設最新 active version)

    UpdateProjectRequest:
      type: object
      properties:
        name: { type: string }
        descriptionMarkdown: { type: string }
        schedule: { $ref: '#/components/schemas/TimeRange' }
        groupIds:
          type: array
          items: { type: string }
        tags:
          type: array
          items: { type: string }

    ProjectPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Project' }
        pageInfo: { $ref: '#/components/schemas/PageInfo' }

    Membership:
      type: object
      properties:
        id: { type: string }
        rootOrgId: { type: string }
        projectId: { type: string }
        userId: { type: string }
        role: { $ref: '#/components/schemas/MembershipRole' }
        joinedAt: { type: string, format: date-time }

    TemplateRef:
      type: object
      description: 由 Template 實例化時記錄的 snapshot,稽核用,不形成執行期相依
      properties:
        templateType:
          type: string
          enum: [PROJECT_TEMPLATE, TASK_TEMPLATE]
        templateScope: { $ref: '#/components/schemas/TemplateScope' }
        templateId: { type: string }
        templateVersion: { type: integer }
        instantiatedAt: { type: string, format: date-time }

    # ---------- Task ----------
    Task:
      type: object
      properties:
        id: { type: string }
        rootOrgId: { type: string }
        projectId: { type: string }
        type:
          type: string
          description: 多型 discriminator,例 EQUIPMENT_INSPECTION
        attributes:
          type: object
          additionalProperties: true
          description: type-specific 屬性,以對應 JSON Schema 驗證
        title: { type: string, description: 允許 Unicode 多語系 }
        descriptionMarkdown: { type: string }
        status: { $ref: '#/components/schemas/TaskStatus' }
        priority: { $ref: '#/components/schemas/Priority' }
        ownerId: { type: string }
        assignees:
          type: array
          minItems: 1
          items: { type: string }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/AttachmentRef' }
        schedule: { $ref: '#/components/schemas/TimeRange' }
        completedAt: { type: string, format: date-time, nullable: true }
        originActionRequestId: { type: string, nullable: true }
        templateRef:
          allOf:
            - $ref: '#/components/schemas/TemplateRef'
          nullable: true
        qaReviewPolicy:
          $ref: '#/components/schemas/QaReviewPolicy'
        qaReviews:
          type: array
          description: append-only QA 雙簽簽核紀錄(v1.3 新增)
          items: { $ref: '#/components/schemas/QaReviewEntry' }
        tags:
          type: array
          items: { type: string }
        overdue: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: string, format: date-time, nullable: true }
        schemaVersion: { type: integer }
      required: [id, rootOrgId, projectId, type, title, status, priority, ownerId, assignees, qaReviewPolicy]

    QaReviewPolicy:
      type: object
      description: |
        Task 建立時(或 ActionRequest convert 時)從所屬 Project.groupIds[].settings.qa 合併 snapshot 的政策。
        後續 Group settings 變更**不影響**本 Task(對應 INV-31)。
        **多 Group 合併規則**:`dualSignRequired = OR(各 group)`;`requiredReviewerRoles = 各 group 的聯集去重`。
        (此 OR 是合併不同 Group 的 policy,與 Q-23 v1.4 OR 白名單語意為**兩件不同事**。Review 評估的 OR 白名單見 `QaSettings` 描述與 ADR-0011 v1.4 Amendment。)
      required: [dualSignRequired, requiredReviewerRoles, snapshotAt]
      properties:
        dualSignRequired: { type: boolean }
        requiredReviewerRoles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
        snapshotAt: { type: string, format: date-time, description: snapshot 時間(ISO 8601 + offset) }
        sourceGroupIds:
          type: array
          description: 來源 Group ID 清單(稽核用)
          items: { type: string }

    QaReviewEntry:
      type: object
      description: 一筆 QA review action 記錄
      required: [reviewerId, reviewerRole, decision, at]
      properties:
        reviewerId: { type: string }
        reviewerRole: { $ref: '#/components/schemas/Role' }
        decision: { $ref: '#/components/schemas/ReviewDecision' }
        reason: { type: string }
        at: { type: string, format: date-time }

    ReviewDecision:
      type: string
      enum: [APPROVED, REJECTED]

    TaskReviewRequest:
      type: object
      required: [decision, role]
      properties:
        decision: { $ref: '#/components/schemas/ReviewDecision' }
        role:
          allOf:
            - $ref: '#/components/schemas/Role'
          description: |
            reviewer 主張此次 review 套用的角色。
            必須 ∈ task.qaReviewPolicy.requiredReviewerRoles 且 actor 具備該角色。
        reason:
          type: string
          description: 決議原因(REJECTED 時建議填寫)

    CreateTaskRequest:
      type: object
      required: [projectId, type, title, ownerId, assignees]
      description: |
        建立 Task。
        - **`qaReviewPolicy` 由 server 自動 snapshot**(從 Project.groupIds[].settings.qa 合併);客戶端**不可**在 request 提供。
        - `ownerId` 必須 ∈ `assignees[]`(INV-1)。
      properties:
        projectId: { type: string }
        type: { type: string }
        attributes:
          type: object
          additionalProperties: true
        title: { type: string, minLength: 1, maxLength: 200 }
        descriptionMarkdown: { type: string }
        priority:
          $ref: '#/components/schemas/Priority'
        ownerId: { type: string }
        assignees:
          type: array
          minItems: 1
          items: { type: string }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/AttachmentRef' }
        schedule: { $ref: '#/components/schemas/TimeRange' }
        tags:
          type: array
          items: { type: string }
        fromTemplateId:
          type: string
          description: 若指定,從 TaskTemplate clone(預填 type / attributes / priority / description / checklist 等)
        fromTemplateScope:
          $ref: '#/components/schemas/TemplateScope'
        fromTemplateVersion:
          type: integer

    UpdateTaskRequest:
      type: object
      properties:
        title: { type: string }
        descriptionMarkdown: { type: string }
        priority: { $ref: '#/components/schemas/Priority' }
        attributes:
          type: object
          additionalProperties: true
        schedule: { $ref: '#/components/schemas/TimeRange' }
        tags:
          type: array
          items: { type: string }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/AttachmentRef' }

    TaskPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Task' }
        pageInfo: { $ref: '#/components/schemas/PageInfo' }

    TaskTypeDefinition:
      type: object
      properties:
        type: { type: string, example: EQUIPMENT_INSPECTION }
        label: { type: string, example: 設備檢查 }
        description: { type: string }
        attributesSchema:
          type: object
          description: 該型態 attributes 的 JSON Schema
          additionalProperties: true
        requiresReview:
          type: boolean
          description: 是否強制走 IN_REVIEW

    # ---------- Templates ----------
    ProjectTemplate:
      type: object
      properties:
        id: { type: string }
        scope: { $ref: '#/components/schemas/TemplateScope' }
        rootOrgId:
          type: string
          nullable: true
          description: GLOBAL scope 時為 null;ORG scope 時必填
        name: { type: string }
        code: { type: string, description: 同 (scope, rootOrgId) 內 unique }
        descriptionMarkdown: { type: string }
        defaultMemberRoles:
          type: object
          description: "角色配置(例 { ENGINEER: 1, OPERATOR: 2 })"
          additionalProperties:
            type: integer
            minimum: 0
        taskTemplateRefs:
          type: array
          items: { $ref: '#/components/schemas/TaskTemplateRef' }
        estimatedDurationDays: { type: integer, minimum: 0 }
        tags:
          type: array
          items: { type: string }
        forkedFrom:
          allOf:
            - $ref: '#/components/schemas/ForkRef'
          nullable: true
          description: 若由 GLOBAL fork 而來則記錄
        version: { type: integer, minimum: 1 }
        active: { type: boolean }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: string, format: date-time, nullable: true }
        schemaVersion: { type: integer }
      required: [id, scope, name, code, version, active]

    TaskTemplateRef:
      type: object
      required: [taskTemplateId, version, sortOrder]
      properties:
        taskTemplateScope: { $ref: '#/components/schemas/TemplateScope' }
        taskTemplateId: { type: string }
        version: { type: integer, minimum: 1 }
        sortOrder: { type: integer }
        estimatedHours: { type: number, format: float }

    ForkRef:
      type: object
      required: [sourceTemplateId, sourceVersion, forkedAt]
      properties:
        sourceTemplateId: { type: string }
        sourceVersion: { type: integer }
        forkedAt: { type: string, format: date-time }
        forkedBy: { type: string }

    CreateProjectTemplateRequest:
      type: object
      required: [name, code]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        code: { type: string, minLength: 1, maxLength: 64 }
        descriptionMarkdown: { type: string }
        defaultMemberRoles:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
        taskTemplateRefs:
          type: array
          items: { $ref: '#/components/schemas/TaskTemplateRef' }
        estimatedDurationDays: { type: integer, minimum: 0 }
        tags:
          type: array
          items: { type: string }

    UpdateProjectTemplateRequest:
      type: object
      description: 更新會建立新 version,既有 version 凍結
      properties:
        name: { type: string }
        descriptionMarkdown: { type: string }
        defaultMemberRoles:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
        taskTemplateRefs:
          type: array
          items: { $ref: '#/components/schemas/TaskTemplateRef' }
        estimatedDurationDays: { type: integer }
        tags:
          type: array
          items: { type: string }
        active: { type: boolean }

    ProjectTemplatePage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ProjectTemplate' }
        pageInfo: { $ref: '#/components/schemas/PageInfo' }

    TaskTemplate:
      type: object
      properties:
        id: { type: string }
        scope: { $ref: '#/components/schemas/TemplateScope' }
        rootOrgId:
          type: string
          nullable: true
          description: GLOBAL scope 時為 null;ORG scope 時必填
        name: { type: string }
        code: { type: string }
        type:
          type: string
          description: 對應 Task `type`(必須是已註冊的 type)
        defaultPriority: { $ref: '#/components/schemas/Priority' }
        defaultAttributes:
          type: object
          additionalProperties: true
          description: 預填 Task attributes,實例化時 clone
        descriptionMarkdownTemplate: { type: string }
        defaultChecklist:
          type: array
          items: { $ref: '#/components/schemas/ChecklistItem' }
        attachmentHints:
          type: array
          items: { type: string }
        tags:
          type: array
          items: { type: string }
        forkedFrom:
          allOf:
            - $ref: '#/components/schemas/ForkRef'
          nullable: true
        version: { type: integer, minimum: 1 }
        active: { type: boolean }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: string, format: date-time, nullable: true }
        schemaVersion: { type: integer }
      required: [id, scope, name, code, type, version, active]

    ChecklistItem:
      type: object
      required: [id, label]
      properties:
        id: { type: string }
        label: { type: string }
        required: { type: boolean, default: false }

    CreateTaskTemplateRequest:
      type: object
      required: [name, code, type]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        code: { type: string, minLength: 1, maxLength: 64 }
        type: { type: string }
        defaultPriority: { $ref: '#/components/schemas/Priority' }
        defaultAttributes:
          type: object
          additionalProperties: true
        descriptionMarkdownTemplate: { type: string }
        defaultChecklist:
          type: array
          items: { $ref: '#/components/schemas/ChecklistItem' }
        attachmentHints:
          type: array
          items: { type: string }
        tags:
          type: array
          items: { type: string }

    UpdateTaskTemplateRequest:
      type: object
      description: 更新會建立新 version,既有 version 凍結
      properties:
        name: { type: string }
        defaultPriority: { $ref: '#/components/schemas/Priority' }
        defaultAttributes:
          type: object
          additionalProperties: true
        descriptionMarkdownTemplate: { type: string }
        defaultChecklist:
          type: array
          items: { $ref: '#/components/schemas/ChecklistItem' }
        attachmentHints:
          type: array
          items: { type: string }
        tags:
          type: array
          items: { type: string }
        active: { type: boolean }

    TaskTemplatePage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TaskTemplate' }
        pageInfo: { $ref: '#/components/schemas/PageInfo' }

    # ---------- Comment ----------
    Comment:
      type: object
      properties:
        id: { type: string }
        taskId: { type: string }
        authorId: { type: string }
        bodyMarkdown: { type: string }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/AttachmentRef' }
        createdAt: { type: string, format: date-time }
        editedAt: { type: string, format: date-time, nullable: true }
        deletedAt: { type: string, format: date-time, nullable: true }

    CreateCommentRequest:
      type: object
      required: [bodyMarkdown]
      properties:
        bodyMarkdown: { type: string, minLength: 1 }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/AttachmentRef' }

    # ---------- ActionRequest(v1.3:Single-hop direct dispatch)----------
    ActionRequest:
      type: object
      properties:
        id: { type: string }
        rootOrgId: { type: string }
        projectId:
          type: string
          nullable: true
          description: 自課內提報時必填;跨層 dispatch 起初可空,leaf triage 時關聯 Project
        originatingOrgId:
          type: string
          description: |
            發起者所掛的 Organization 節點(actor 是該節點的 manager,且該節點是 targetOrg 的祖先;
            自課內提報時 = targetOrgId)
        targetOrgId:
          type: string
          description: |
            **v1.3 改名**(取代 v1.2 `assignedToOrgId`)。**必為 leaf Organization**(`type ∈ root.settings.leafTypes`)。
            一旦寫入後不再變動(無中途 relay 流程)。
        title: { type: string, description: 允許 Unicode 多語系 }
        descriptionMarkdown: { type: string }
        severity:
          type: object
          properties:
            level: { $ref: '#/components/schemas/SeverityLevel' }
            reason: { type: string }
        status: { $ref: '#/components/schemas/ActionRequestStatus' }
        requesterId: { type: string }
        ownerId:
          type: string
          nullable: true
          description: |
            預設規則(對應 ADR-0010):
            - targetOrg.leaderIds == 0 → 409,不會建立
            - == 1 → 自動 = leaderIds[0]
            - >= 2 → 派工方在 dispatch payload 指定,必須 ∈ leaderIds
        linkedTaskId: { type: string, nullable: true }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/AttachmentRef' }
        submittedAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time, nullable: true }
        deletedAt: { type: string, format: date-time, nullable: true }
      required: [id, rootOrgId, originatingOrgId, targetOrgId, title, severity, status, requesterId]

    # v1.3 移除:RelayHop schema(隨 relayChain 一併刪除)

    CreateActionRequestRequest:
      type: object
      required: [projectId, title, severity]
      description: |
        自課內提報用(actor 為該 leaf Org 內 user)。
        - 跨層派工請改用 `POST /orgs/{targetOrgId}/dispatch-action-request`(v1.3 single-hop direct dispatch)
        - 自課內提報時 server 自動設 originatingOrgId = targetOrgId = actor 所屬 leaf Org
      properties:
        projectId: { type: string }
        title: { type: string, minLength: 1, maxLength: 200 }
        descriptionMarkdown: { type: string }
        severity:
          type: object
          required: [level]
          properties:
            level: { $ref: '#/components/schemas/SeverityLevel' }
            reason: { type: string }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/AttachmentRef' }

    DispatchActionRequestRequest:
      type: object
      required: [title, severity]
      description: |
        Manager 直派 ActionRequest 到子孫 leaf Org(`targetOrgId` 由 path `/orgs/{orgId}` 帶入,必為 leaf;v1.3)。
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        descriptionMarkdown: { type: string }
        severity:
          type: object
          required: [level]
          properties:
            level: { $ref: '#/components/schemas/SeverityLevel' }
            reason: { type: string }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/AttachmentRef' }
        dueAt: { type: string, format: date-time, nullable: true }
        ownerId:
          type: string
          nullable: true
          description: |
            **條件必填**:當 `targetOrg.leaderIds.length > 1` 時必填,且必須 ∈ targetOrg.leaderIds。
            - leaderIds.length == 1:可省略,server 自動設 = leaderIds[0];若有提供則須等於該值,否則 422
            - leaderIds.length == 0:整個請求 409 `target_org_no_leader`
            - leaderIds.length >= 2:未提供 → 422 `owner_must_be_specified`;不在集合中 → 422 `owner_not_in_leaders`

    UpdateActionRequestRequest:
      type: object
      properties:
        title: { type: string }
        descriptionMarkdown: { type: string }
        severity:
          type: object
          properties:
            level: { $ref: '#/components/schemas/SeverityLevel' }
            reason: { type: string }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/AttachmentRef' }

    ConvertActionRequestToTaskRequest:
      type: object
      required: [taskType, ownerId, assignees]
      properties:
        taskType: { type: string, example: INCIDENT_RESPONSE }
        title: { type: string }
        descriptionMarkdown: { type: string }
        priority: { $ref: '#/components/schemas/Priority' }
        ownerId: { type: string }
        assignees:
          type: array
          minItems: 1
          items: { type: string }
        attributes:
          type: object
          additionalProperties: true
        schedule: { $ref: '#/components/schemas/TimeRange' }

    ActionRequestPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ActionRequest' }
        pageInfo: { $ref: '#/components/schemas/PageInfo' }

    # ---------- Attachment ----------
    Attachment:
      type: object
      properties:
        id: { type: string }
        rootOrgId: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer }
        storageKey: { type: string, description: 內部儲存 key,前端不直接使用 }
        downloadUrl: { type: string, format: uri, description: 短期 presigned URL }
        uploaderId: { type: string }
        ownerResourceType:
          type: string
          enum: [TASK, ACTION_REQUEST, COMMENT, PROJECT]
        ownerResourceId: { type: string }
        metadata:
          type: object
          properties:
            width: { type: integer }
            height: { type: integer }
            durationMs: { type: integer }
            checksum: { type: string }
        status:
          type: string
          enum: [PENDING_UPLOAD, READY, FAILED, DELETED]
        createdAt: { type: string, format: date-time }

    CreateAttachmentRequest:
      type: object
      required: [mimeType, sizeBytes, ownerResourceType]
      properties:
        mimeType: { type: string }
        sizeBytes: { type: integer, minimum: 1 }
        filename: { type: string }
        ownerResourceType:
          type: string
          enum: [TASK, ACTION_REQUEST, COMMENT, PROJECT]
        ownerResourceId: { type: string, description: 若已知擁有者則填,否則之後再 attach }

    AttachmentUploadTicket:
      type: object
      properties:
        attachment: { $ref: '#/components/schemas/Attachment' }
        uploadUrl: { type: string, format: uri, description: 直接 PUT 此 URL 上傳檔案 }
        uploadHeaders:
          type: object
          additionalProperties: { type: string }
        expiresAt: { type: string, format: date-time }

    # ---------- Notification (預留) ----------
    NotificationPreference:
      type: object
      properties:
        userId: { type: string }
        channels:
          type: object
          properties:
            email: { type: boolean }
            push: { type: boolean }
            line: { type: boolean }
        events:
          type: array
          items:
            type: string
            enum: [TASK_ASSIGNED, OWNER_TRANSFERRED, TASK_DUE_SOON, COMMENT_MENTION, ACTION_REQUEST_SUBMITTED]

    Webhook:
      type: object
      properties:
        id: { type: string }
        rootOrgId: { type: string }
        targetUrl: { type: string, format: uri }
        events:
          type: array
          description: 訂閱的 event type 清單(例 `task.assigned`、`action-request.dispatched`,或 wildcard `task.*`、`>`)
          items: { type: string }
        secret: { type: string, description: 用於 HMAC-SHA256 簽章 }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }

    CreateWebhookRequest:
      type: object
      required: [targetUrl, events]
      properties:
        targetUrl: { type: string, format: uri }
        events:
          type: array
          minItems: 1
          items: { type: string }

    # ---------- Domain Event Payload(NATS / Webhook 共用)----------
    DomainEventPayload:
      type: object
      description: |
        統一 domain event payload schema(NATS message body 與 Webhook POST body 共用)。
        Webhook 額外帶 HTTP headers:`X-Factory-Ops-Signature`(HMAC-SHA256)、`X-Factory-Ops-Event-Id`、`X-Factory-Ops-Event-Type`、`X-Factory-Ops-Timestamp`。
      required: [eventId, eventType, occurredAt, aggregateType, aggregateId]
      properties:
        eventId:
          type: string
          description: ULID,訂閱端用於去重
        eventType:
          type: string
          description: 例 `task.assigned`、`action-request.dispatched`
        occurredAt: { type: string, format: date-time }
        rootOrgId: { type: string, nullable: true }
        orgPath:
          type: array
          items: { type: string }
          description: 從 root 到事件所屬 leaf 的 OrgId 鏈(若適用)
        aggregateType:
          type: string
          enum: [Organization, User, Group, GroupMembership, Project, Task, ActionRequest, ProjectTemplate, TaskTemplate]
        aggregateId: { type: string }
        actorId: { type: string, nullable: true }
        payload:
          type: object
          additionalProperties: true
          description: event-specific payload

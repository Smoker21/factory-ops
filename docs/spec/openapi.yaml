      tags: [Users]
      summary: 建立使用者(以 accountName 從 HR 同步建立;ORG_ADMIN / ADMIN)
      description: |
        Server 會以 `accountName` 呼叫 HR 服務驗證該員工存在且在職;HR 無此 accountName 則 422,HR 不可達則 503。
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: |
            已建立(本地投影)。回應包含 temporaryPassword 供一次性顯示(S-011)。
            此密碼不會再次出現,請立即傳達給使用者。
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  temporaryPassword:
                    type: string
                    description: 一次性暫時密碼(伺服器端 SecureRandom 產生,不儲存明文)
                required: [user, temporaryPassword]
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          description: HR 服務暫時不可達
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /users/{userId}:

  /orgs/{orgId}/groups/{groupId}/settings:
    parameters:
      - $ref: '#/components/parameters/OrgIdParam'
      - $ref: '#/components/parameters/GroupIdParam'
    get:
      tags: [Groups]
      summary: 讀取 Group settings(含 QA 雙簽設定)
      description: |
        Group settings 控制該 Group 的工作流客製,目前主要為 `qa` 子文件(QA 雙簽)。
        詳見 ADR-0011。
      responses:
        '200':
          description: Group settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupSettings' }
    patch:
      tags: [Groups]
      summary: 更新 Group settings(GROUP_MANAGER / GROUP_ADMIN)
      description: |
        - 變更**只影響此後新建立的 Task**;進行中 Task 仍使用其建立時 snapshot 的 `qaReviewPolicy`(對應 INV-31)。
        - `qa.dualSignRequired = true` 但 `requiredReviewerRoles[]` 為空 → 422
        - `requiredReviewerRoles[]` 只能含第一線角色(OPERATOR / SHIFT_LEAD / ENGINEER / QA / GROUP_ADMIN / GROUP_MANAGER),否則 422
        - 變更會寫入 `Group.history[]` 並 emit `factory-ops.group.settings-qa-updated`。
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateGroupSettingsRequest' }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupSettings' }
        '422':
          $ref: '#/components/responses/ValidationError'


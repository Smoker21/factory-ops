      tags: [Tasks]
      summary: 加入指派人(批次)
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userIds]
              properties:
                userIds:
                  type: array
                  minItems: 1
                  items: { type: string }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }

  /tasks/{taskId}/assignees/{userId}:
    parameters:
      - $ref: '#/components/parameters/TaskIdParam'
      - $ref: '#/components/parameters/UserIdParam'
    delete:
      tags: [Tasks]
      summary: 移除指派人

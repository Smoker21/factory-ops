openapi: 3.1.0
info:
  title: Factory Ops API
  description: |
    工廠值班工作管理系統 REST API(v1.5)。
    - API-first,Web 與未來 Native App 共用同一組 API。
    - **認證(v1.5,M5.1.5 補件)**:雙模兼容,過渡期(見 ADR-0015 與 requirements.md §FR-1.5 ~ §FR-1.8):
      - **Cookie 模式**(目標):`access_token`(httpOnly + Secure + SameSite=Strict;Path=`/v1`;15m)、`refresh_token`(httpOnly + Secure + SameSite=Strict;Path=`/v1/auth`;7d);CSRF 採 double-submit cookie pattern(`XSRF-TOKEN` cookie 為 non-httpOnly + Secure + SameSite=Strict;Path=`/v1`;15m)
      - **Bearer 模式**(過渡相容):`Authorization: Bearer <accessToken>` header,M5.5 frontend 切換完成後 M6 移除
      - **Resolver 順序**:cookie `access_token` 優先,fallback Bearer header;同時帶不同 token → 以 cookie 為準
      - **CSRF 強制**:**所有 `POST` / `PATCH` / `PUT` / `DELETE` 端點**(除 `/v1/auth/login` 與 `/v1/health`)必須帶 `X-XSRF-TOKEN` request header,值需與 `XSRF-TOKEN` cookie 完全相等,否則 403 + RFC 7807 `CSRF_TOKEN_MISMATCH`。Header 集中定義於 `components.parameters.CsrfHeader` 並在每個 mutating 端點 `$ref` 引用。OpenAPI 無法表達「優先序」,以本段文字補充。
      - **Dev 環境**(non-prod):SameSite=Lax 以解決 localhost 跨 port(`:5173` ↔ `:8080`);prod 一律 Strict
    - JWT claims 帶 `userId`、`accountName`、`rootOrgId`、`orgPath[]`、`roles[]`、`groupIds[]`、`orgManagerScopes[]`(衍生自 Organization.managerId 反查)。
    - **多租戶隔離**:所有資源(除 `Organization` 自身)歸屬於某個 `rootOrgId`,server 強制 scope。跨 root org 操作僅 `ADMIN` 系統角色可進行。
    - **時間欄位**:wire format 使用 ISO 8601 + offset(例 `2026-05-04T08:30:00+08:00`,Q-17 拍板);儲存層為 UTC `Instant`(**Q-24 v1.4 拍板:不保留發起端原始 offset**)。
    - 列表端點預設使用 cursor-based pagination,支援欄位投影與增量同步。
    - **Organization 為 polymorphic 樹**(FAB → DIVISION → DEPARTMENT → SECTION),只有 leaf type 可以承載 Group / Project / Task(見 ADR-0004)。每節點有 **單一 `managerId`**(對應 ORG_MANAGER)+ **多位 `leaderIds[]`**(業務負責人列表)— 見 ADR-0010。Manager 休假代理透過 `POST /orgs/{id}/transfer-manager` 暫代,**無 deputy 欄位**(Q-19 v1.4 拍板,代理人選由 HR 端決定)。
    - **Group 為平面結構**(屬唯一 leaf Organization),polymorphic by `type`(DEFAULT / LINE / TEAM / SHIFT…);Group 加 `settings.qa` 用於設定 QA 雙簽機制(見 ADR-0011)。Group settings 不另做專屬 versioning,沿用 `Group.history[]`(Q-22 v1.4 拍板)。
    - **Template 機制**:支援 GLOBAL(ADMIN 維護)與 ORG(各 Org 維護)兩種 scope;可 fork from GLOBAL,可直接實例化(見 ADR-0006)。
    - **跨層派工(v1.3 改寫,Q-18 v1.4 確認)**:**任一**具備 manager 身份的上級 Organization 節點(不限 root)可直接派 ActionRequest 到其子孫中的 leaf Org(`targetOrgId` 必為 leaf);授權判定為 server 沿 ancestry path 驗證 actor manager scope。**v1.3 移除多層 relay 流程**(見 ADR-0008 v1.3)。Leaf 端 reject 僅 emit `factory-ops.action-request.rejected` event,不主動推 in-app push(Q-20 v1.4 拍板)。
    - **Task QA 雙簽**:Task 建立時從所屬 Project.groupIds 對應 Group settings.qa snapshot policy;之後 Group settings 變更不影響該 Task;Review action 走 `POST /tasks/{taskId}/review`(見 ADR-0011 含 v1.4 Amendment)。**Q-23 v1.4 拍板:`requiredReviewerRoles` 為 OR 白名單**(列示中的角色才能簽,不要求每角色到齊;`dualSignRequired = true` 要求 `qaReviews.size >= 2`,角色組合任意;同人可多角色簽)。Review reject 清空 `qaReviews[]` 並回 IN_PROGRESS(Q-21 v1.4 拍板)。
    - **HR 整合**:User 為 HR User 的本地投影,以 `accountName` 對 HR Mock REST 查詢(見 ADR-0007 v1.3 Amendment + v1.4 Amendment 補充 deputy 由 HR 端負責)。
    - **事件分發**:NATS + Webhook 雙通道(見 ADR-0009 含 v1.4 Amendment)。
  version: 1.5.0
  contact:
    name: Factory Ops Team
servers:
  - url: https://api.factory-ops.example.com/v1
    description: Production
  - url: http://localhost:8080/v1
    description: Local development

tags:
  - name: Auth
    description: 認證與令牌管理
  - name: Organizations
    description: 組織(多型樹:FAB / DIVISION / DEPARTMENT / SECTION,只有 leaf 可承載工作)
  - name: Users
    description: 使用者(HR 投影;ORG_ADMIN / ADMIN 操作)
  - name: Me
    description: 當前登入者自身資源
  - name: Groups
    description: 群組(平面結構,屬唯一 leaf Organization;polymorphic by type)
  - name: GroupMemberships
    description: Group 成員管理
  - name: Projects
    description: 專案(必須屬於 leaf Organization)
  - name: Tasks
    description: 任務(多型)
  - name: ActionRequests
    description: 動作需求(支援跨層派工)
  - name: Comments
    description: 任務留言
  - name: Attachments
    description: 附件上傳
  - name: Memberships
    description: Project 成員管理
  - name: ProjectTemplates
    description: Project 範本管理(GLOBAL / ORG)
  - name: TaskTemplates
    description: Task 範本管理(GLOBAL / ORG)
  - name: SystemTemplates
    description: 全域 Template 庫(ADMIN 維護)
  - name: Webhooks
    description: 事件訂閱(NATS 之外的對外通知)
  - name: Health
    description: 健康檢查

security:
  # v1.5 雙模:OpenAPI 列舉多項為 OR(任一通過即可);實作上 cookie 優先,fallback bearer。詳見 ADR-0015 / §FR-1.6。
  - cookieAuth: []
  - bearerAuth: []

paths:
  # ===================== Health =====================
  /health:
    get:
      tags: [Health]
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: UP }

  # ===================== Auth =====================
  /auth/login:
    post:
      tags: [Auth]
      summary: 以 accountName + 密碼登入
      description: |
        認證使用者。套用 per-IP 與 per-account 速率限制(S-015)。
        連續失敗 5 次後帳號暫時鎖定 15 分鐘(S-016)。
        帳號鎖定時回傳 401 + errorCode=ACCOUNT_LOCKED + retryAfterSeconds。

        **v1.5 cookie 設定(§FR-1.5 ~ §FR-1.8 / ADR-0015)**:
        成功響應同時設三個 `Set-Cookie`:
        - `access_token`(HttpOnly + Secure + SameSite=Strict;Path=`/v1`;15m)
        - `refresh_token`(HttpOnly + Secure + SameSite=Strict;Path=`/v1/auth`;7d)
        - `XSRF-TOKEN`(non-HttpOnly + Secure + SameSite=Strict;Path=`/v1`;15m;client 讀此 cookie 並於 mutating request 帶 `X-XSRF-TOKEN` header)

        **Dev 環境**:`SameSite=Lax` 替代 Strict 以支援 localhost 跨 port。
        **Body 仍回 `TokenPair`**:過渡期 Bearer header 模式並存,M6 全切 cookie 後再移除 body 欄位。
        **本端點 CSRF 豁免**:client 尚未持有 cookie,無從 double-submit。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: |
            登入成功。回傳 access + refresh token(向前相容 Bearer 模式),同時設定 cookie(v1.5 cookie 模式)。
          headers:
            Set-Cookie:
              description: |
                **多筆 Set-Cookie**(HTTP 規範允許重複此 header):
                1. `access_token=<jwt>; Path=/v1; HttpOnly; Secure; SameSite=Strict; Max-Age=900`
                2. `refresh_token=<jwt>; Path=/v1/auth; HttpOnly; Secure; SameSite=Strict; Max-Age=604800`
                3. `XSRF-TOKEN=<nonce>; Path=/v1; Secure; SameSite=Strict; Max-Age=900`
                Dev 環境 SameSite=Lax。
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: 憑證錯誤或帳號鎖定(ACCOUNT_LOCKED)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: 速率限制觸發 — 見 Retry-After header
          headers:
            Retry-After:
              description: 距下次可重試的秒數
              schema: { type: integer }
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: 以 refresh token 換發新的 access token
      description: |
        **v1.5 行為(§FR-1.5 / §FR-1.8 / ADR-0015)**:
        - **優先從 `refresh_token` cookie 讀取**;若 cookie 不存在則 fallback request body `{ refreshToken }`(M5.5 frontend 切完後 M6 移除 body 路徑)
        - 成功響應 rotate 三個 cookie(舊 refresh jti 立即黑名單,新 jti 取代;XSRF-TOKEN 同步重發)
        - **CSRF 強制**:本端點屬 mutating,必須帶 `X-XSRF-TOKEN`(login 後 client 已持有 cookie,可正常 double-submit)
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: false
        description: |
          v1.5:**選填**(向前兼容)。若 `refresh_token` cookie 已帶,server 優先使用 cookie;cookie 缺漏時才使用 body。
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string, description: v1.5 起選填,優先讀 cookie }
      responses:
        '200':
          description: |
            新 token pair。同時 rotate 三個 cookie(屬性同 `/auth/login` 200)。
          headers:
            Set-Cookie:
              description: |
                **多筆 Set-Cookie**(rotate):
                1. `access_token=<jwt>; Path=/v1; HttpOnly; Secure; SameSite=Strict; Max-Age=900`
                2. `refresh_token=<jwt>; Path=/v1/auth; HttpOnly; Secure; SameSite=Strict; Max-Age=604800`
                3. `XSRF-TOKEN=<nonce>; Path=/v1; Secure; SameSite=Strict; Max-Age=900`
                Dev 環境 SameSite=Lax。
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfMismatch'

  /auth/logout:
    post:
      tags: [Auth]
      summary: 登出(撤銷 refresh token)
      description: |
        將 refresh token jti 加入黑名單。套用 per-IP 速率限制(S-015)。

        **v1.5 行為(§FR-1.8 / ADR-0015)**:
        - 優先從 `refresh_token` cookie 讀取;若 cookie 不存在則 fallback request body
        - 成功響應將三個 cookie 全部以 `Max-Age=0` 清除(`access_token`、`refresh_token`、`XSRF-TOKEN`)
        - **CSRF 強制**:本端點屬 mutating,必須帶 `X-XSRF-TOKEN`
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: false
        description: |
          v1.5:**選填**(向前兼容)。
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string, description: v1.5 起選填,優先讀 cookie }
      responses:
        '204':
          description: |
            No Content。三個 cookie 已清除。
          headers:
            Set-Cookie:
              description: |
                **多筆 Set-Cookie**(清除):
                1. `access_token=; Path=/v1; HttpOnly; Secure; SameSite=Strict; Max-Age=0`
                2. `refresh_token=; Path=/v1/auth; HttpOnly; Secure; SameSite=Strict; Max-Age=0`
                3. `XSRF-TOKEN=; Path=/v1; Secure; SameSite=Strict; Max-Age=0`
              schema: { type: string }
        '403':
          $ref: '#/components/responses/CsrfMismatch'
        '429':
          description: 速率限制觸發 — 見 Retry-After header
          headers:
            Retry-After:
              description: 距下次可重試的秒數
              schema: { type: integer }
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /auth/password:
    put:
      tags: [Auth]
      summary: 變更自己的密碼
      description: |
        驗證目前密碼並強制新密碼強度(>= 12 字元，>= 3 種字元類別)。
        套用 per-IP 與 per-account 速率限制(S-011, S-015)。

        **v1.5 行為(§FR-1.8 / ADR-0015)**:不影響三個 auth cookie(避免改密碼後立即登出造成 UX 中斷);若需「全裝置登出」,M6 候選改 user-scoped jti 黑名單機制。
        **CSRF 強制**:本端點屬 mutating,必須帶 `X-XSRF-TOKEN`
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password, minLength: 12 }
      responses:
        '204': { description: No Content }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfMismatch'
        '422':
          description: 新密碼不符強度要求
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: 速率限制觸發 — 見 Retry-After header
          headers:
            Retry-After:
              description: 距下次可重試的秒數
              schema: { type: integer }
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  # ===================== Me =====================
  /me:
    get:
      tags: [Me]
      summary: 取得當前登入者資料
      responses:
        '200':
          description: 自身資料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me/notification-preferences:
    get:
      tags: [Me]
      summary: 取得通知偏好(預留)
      responses:
        '200':
          description: 通知偏好
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreference'
    put:
      tags: [Me]
      summary: 更新通知偏好(預留)
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPreference'
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreference'

  # ===================== Organizations =====================
  /orgs:
    get:
      tags: [Organizations]
      summary: 列出 Organization 節點(僅當前 user 所屬 root 樹的節點;ADMIN 跨樹)
      description: |
        支援多種過濾:
        - `type=FAB|DIVISION|DEPARTMENT|SECTION|...`
        - `parentId=<id>`(取直接子節點;傳 `null` 取 root)
        - `leafOnly=true`(只回 type ∈ leafTypes 的節點)
        - `underOrgId=<id>`(回該節點及其子孫;server 沿樹計算)
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
        - in: query
          name: type
          schema: { type: string }
          description: 過濾 Organization 型態
        - in: query
          name: parentId
          schema: { type: string, nullable: true }
          description: 過濾 parentId;傳 `null` 取 root
        - in: query
          name: leafOnly
          schema: { type: boolean, default: false }
          description: 只回 leaf type(可承載工作的節點)
        - in: query
          name: underOrgId
          schema: { type: string }
          description: 沿樹回傳該節點及其子孫
        - in: query
          name: q
          schema: { type: string }
      responses:
        '200':
          description: Organization 清單
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationPage' }
    post:
      tags: [Organizations]
      summary: 建立 Organization 節點
      description: |
        - 建立 root(無 parentId):僅 `ADMIN` 可。
        - 建立子節點(有 parentId):`ORG_ADMIN`(同 root)或 `ADMIN`。
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrganizationRequest' }
      responses:
        '201':
          description: 已建立
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /orgs/{orgId}:
    parameters:
      - $ref: '#/components/parameters/OrgIdParam'
    get:
      tags: [Organizations]
      summary: 讀取單一 Organization 節點
      responses:
        '200':
          description: Organization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Organizations]
      summary: 更新 Organization 節點(name / parentId / leaderId / settings(僅 root))
      description: 變更 parentId 會即時驗證 cycle 與深度上限,失敗回 409
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateOrganizationRequest' }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Organizations]
      summary: 軟刪除 Organization 節點
      description: |
        - 非 leaf 節點:必須先處理(移除/軟刪)所有子孫,否則 409
        - C-014:若該節點仍有 active Projects 或 Groups → 409 `has_active_resources`
        - root:cascade soft-delete 整棵樹下所有資源
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204': { description: No Content }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Organization has active children, active projects, or groups.
            Error codes: `has_children`, `has_active_resources`.
          $ref: '#/components/responses/Conflict'

  /orgs/{orgId}/transfer-manager:
    parameters:
      - $ref: '#/components/parameters/OrgIdParam'
    post:
      tags: [Organizations]
      summary: 設置 / 變更 / 清空 Organization 節點 manager(ORG_ADMIN / ADMIN;v1.3 取代 transfer-leader)
      description: |
        - 每個 Organization 節點最多一位 `managerId`(對應 ORG_MANAGER 角色)。
        - 傳 `newManagerId: null` 表示清空(該節點暫無 manager)。
        - 變更會寫入 `Organization.history[]` 並 emit `factory-ops.org.manager-transferred`。
        - 對應的 `User.orgManagerScopes[]` 衍生欄位由 reactor 同步維護。
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newManagerId]
              properties:
                newManagerId:
                  type: string
                  nullable: true
                  description: 新 manager 的 userId;傳 null 表示清空
                reason: { type: string }
      responses:
        '200':
          description: 已變更
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '422':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'

  /orgs/{orgId}/leaders:
    parameters:
      - $ref: '#/components/parameters/OrgIdParam'
    get:
      tags: [Organizations]
      summary: 列出該 Organization 節點的 leaders(0..N)
      description: |
        回傳 `leaderIds[]` 對應的 User snapshot;leader 為該節點的業務負責人,
        於 ActionRequest dispatch 時為 ownerId 預設候選(見 ADR-0010)。
      responses:
        '200':
          description: Leader 清單
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
    post:
      tags: [Organizations]
      summary: 新增一位 leader(ORG_ADMIN / ADMIN)
      description: |
        - 將 `userId` 加入該節點的 `leaderIds[]`;若已存在則 409。
        - user 必須與 Organization 同 `rootOrgId` 且 `active = true`,否則 422。
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string }
                reason: { type: string }
      responses:
        '201':
          description: 已加入
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /orgs/{orgId}/leaders/{userId}:
    parameters:
      - $ref: '#/components/parameters/OrgIdParam'
      - $ref: '#/components/parameters/UserIdParam'
    delete:
      tags: [Organizations]
      summary: 移除一位 leader(ORG_ADMIN / ADMIN)
      description: |
        - 將指定 `userId` 自 `leaderIds[]` 移除。
        - 若為最後一位 leader,允許移除(`leaderIds.length == 0`),但之後新派工到此 leaf 會 409 `target_org_no_leader`。
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204': { description: No Content }
        '404':
          $ref: '#/components/responses/NotFound'

  /orgs/{orgId}/dispatch-action-request:
    parameters:
      - $ref: '#/components/parameters/OrgIdParam'
    post:
      tags: [ActionRequests]
      summary: 上級向下級 leaf 直接派 ActionRequest(Single-hop;v1.3 改寫)
      description: |
        - `orgId` 是 **targetOrgId**(被派的 leaf Organization)。
        - **target 必為 leaf**(`type ∈ root.settings.leafTypes`),否則 422 `target_must_be_leaf`。
        - actor 必須是 target 某個祖先節點(含 target 本身)的 manager(`Organization.managerId == actor.userId`),否則 403 `not_authorized_to_dispatch`。server 自動推導 `originatingOrgId` 為「actor 所有 manager scope 中,target 的最近祖先」。
        - **預設 ownerId 規則**(見 ADR-0010):
          - `targetOrg.leaderIds.length == 0` → 409 `target_org_no_leader`
          - `length == 1` → 自動 `ownerId = leaderIds[0]`(忽略 body.ownerId 或要求等於該值)
          - `length >= 2` → 必須 body.ownerId ∈ leaderIds;未提供則 422 `owner_must_be_specified`,不在集合中則 422 `owner_not_in_leaders`
        - **v1.3 移除「relay 到下一級」流程**;不再有 `POST /action-requests/{id}/relay`。
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DispatchActionRequestRequest' }
      responses:
        '201':
          description: 已建立 ActionRequest
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionRequest' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ===================== Groups =====================
  /orgs/{orgId}/groups:
    parameters:
      - $ref: '#/components/parameters/OrgIdParam'
    get:
      tags: [Groups]
      summary: 列出 Group(平面;支援以 type / organizationId / underOrgId 過濾)
      description: |
        Path 中的 `orgId` 為 **rootOrgId**;Group 為平面結構,無 parentId。
        - `organizationId=<leafOrgId>`:過濾屬於某個 leaf Org 的 Groups
        - `underOrgId=<orgId>`:過濾「屬於該節點底下任一 leaf Org」的 Groups(server 沿 Org 樹計算)
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/FieldsParam'
        - in: query
          name: type
          schema: { type: string }
          description: 過濾 Group 型態(DEFAULT / LINE / TEAM / SHIFT…)
        - in: query
          name: organizationId
          schema: { type: string }
          description: 過濾屬於某個 leaf Organization 的 Groups
        - in: query
          name: underOrgId
          schema: { type: string }
          description: 過濾屬於該 Org 節點底下任一 leaf 的 Groups(server 計算 ancestry)
        - in: query
          name: leaderId
          schema: { type: string }
        - in: query
          name: q
          schema: { type: string }
          description: 名稱關鍵字
      responses:
        '200':
          description: Group 清單
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupPage' }
    post:
      tags: [Groups]
      summary: 建立 Group(必須屬於 leaf Organization)
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateGroupRequest' }
      responses:
        '201':
          description: 已建立
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '422':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'


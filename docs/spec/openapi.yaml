          description: 已移轉
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }

  /tasks/{taskId}/review:
    parameters:
      - $ref: '#/components/parameters/TaskIdParam'
    post:
      tags: [Tasks]
      summary: QA 雙簽 Review action(IN_REVIEW → DONE 流程;v1.3 新增,**v1.4 改採 Q-23 OR 白名單語意**)
      description: |
        - 必要前置:`task.status == IN_REVIEW`(若 `qaReviewPolicy.dualSignRequired == false` 則一筆 APPROVED 即 auto-complete)。
        - actor 必須具備 body.role 角色,且 **body.role ∈ `task.qaReviewPolicy.requiredReviewerRoles`(白名單)**(否則 422 `role_not_required`)。
        - 同 `(taskId, reviewerId, role)` 不可重複(否則 409 `review_already_submitted`);**同一 user 可以以不同角色多次簽核並各記一筆**(Q-23 / Q5 B v1.4 拍板;新 INV-36)。
        - **APPROVED**:append `qaReviews[]` 一筆;**Auto-complete 條件**(Q-23 v1.4 OR 白名單,見 ADR-0011 v1.4 Amendment §2):`(qaReviewPolicy.dualSignRequired ? qaReviews.size >= 2 : qaReviews.size >= 1)` 且 所有 `qaReviews[].reviewerRole ∈ requiredReviewerRoles` 且 所有 `decision == APPROVED` → 自動推進 `status = DONE` 並 emit `factory-ops.task.completed`。
        - **REJECTED**(Q-21 v1.4 拍板):append history + **清空 `qaReviews[]`** + status 回退至 `IN_PROGRESS` + emit `factory-ops.task.review-rejected`;`history[]` 保留稽核軌跡。
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskReviewRequest' }
      responses:
        '200':
          description: 已記錄 review;若蒐集完成 status 推進至 DONE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'


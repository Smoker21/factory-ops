      responses:
        '204': { description: No Content }

  /tasks/{taskId}/status:
    parameters:
      - $ref: '#/components/parameters/TaskIdParam'
    post:
      tags: [Tasks]
      summary: 變更 Task 狀態
      description: |
        - 若 `task.qaReviewPolicy.dualSignRequired = true`,則 `IN_PROGRESS → DONE` 直推路徑被禁止(INV-6),
          必須走 `IN_REVIEW` + `POST /tasks/{id}/review` 蒐集完成。
        - **GROUP_MANAGER 可強制 force-complete**:於 dualSignRequired = true 的 Task 直接 `IN_PROGRESS → DONE` 時,
          server 會檢查 actor 是否具 GROUP_MANAGER 角色 + body 必須附 `bypassReason`(以 `reason` 欄位提供;
          force-complete 場景 reason 為**必填**;否則 422)。
          此情境下 `factory-ops.task.completed` 事件 payload 帶 `bypassed: true`。
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/TaskStatus' }
                reason:
                  type: string
                  description: |
                    一般狀態變更為選填;當 force-complete 帶雙簽 Task 時為**必填**(作為 bypassReason 寫入 history payload)。
      responses:
        '200':
          description: 已變更
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /tasks/{taskId}/assignees:
    parameters:
      - $ref: '#/components/parameters/TaskIdParam'
